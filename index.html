<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dear Ekra | Content Creator & Brand Promoter</title>
  <meta name="description"
    content="I help Dhaka's food places and resorts reach thousands of people. Measurable reach, authentic storytelling, and proven brand impact." />

  <!-- Open Graph for Facebook Sharing -->
  <meta property="og:title" content="Dear Ekra | Creator & Brand Impact" />
  <meta property="og:description"
    content="I help Dhaka's food places and resorts reach thousands of people. See the real numbers." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/portraits/dear-ekra-footer-art-money.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Dear Ekra | Creator & Brand Impact" />
  <meta name="twitter:image" content="/portraits/dear-ekra-footer-art-money.jpg" />
  <meta name="theme-color" content="#FFFFFF" />

  <!-- DNS prefetch for third-party embeds -->
  <link rel="dns-prefetch" href="https://www.facebook.com">

  <!-- Preload LCP hero portrait (first look) for instant paint -->
  <link rel="preload" as="image" href="/portraits/pic1_cutout.webp" type="image/webp">

  <!-- Preconnect to Google Fonts CDN -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Critical fonts: Bricolage Grotesque (display headings) + Anek Bangla (body) loaded with swap -->
  <!-- Reduced to only the weights actually used in the codebase -->
  <link
    href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;700;800&display=swap"
    rel="stylesheet">

  <!-- Non-critical fonts: Cormorant Garamond (serif/italic accents), Inter (sans), Noto Serif Bengali - loaded async -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Inter:wght@400;500;600&family=Noto+Serif+Bengali:wght@400;600&display=swap"
    onload="this.onload=null;this.rel='stylesheet'">
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600;1,700&family=Inter:wght@400;500;600&family=Noto+Serif+Bengali:wght@400;600&display=swap"
      rel="stylesheet">
  </noscript>

  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%230E3B3A'/><circle cx='50' cy='50' r='24' fill='%23F5A300'/></svg>" />
</head>

<body class="bg-mist-rain text-ink font-body selection:bg-marigold selection:text-teal-darker antialiased">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
